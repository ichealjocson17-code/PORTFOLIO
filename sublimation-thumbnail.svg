<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2748"/>
      <stop offset="55%" stop-color="#0b1830"/>
      <stop offset="100%" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fe8ff"/>
      <stop offset="100%" stop-color="#2f7df5"/>
    </linearGradient>
    <linearGradient id="violetPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d6bff"/>
      <stop offset="100%" stop-color="#ff67c8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe181"/>
      <stop offset="100%" stop-color="#ffae2b"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81ffd5"/>
      <stop offset="100%" stop-color="#1ac8a1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tshirtClip">
      <path d="M0,70 L38,18 L88,0 L135,24 L160,58 L145,88 L115,77 L115,250 L45,250 L45,77 L15,88 Z"/>
    </clipPath>
    <clipPath id="jerseyClip">
      <path d="M0,76 L36,20 L84,0 L130,18 L168,78 L145,103 L116,87 L116,252 L52,252 L52,87 L23,103 Z"/>
    </clipPath>
    <clipPath id="poloClip">
      <path d="M0,78 L34,24 L78,0 L95,16 L112,0 L156,24 L190,78 L165,100 L138,86 L138,255 L52,255 L52,86 L25,100 Z"/>
    </clipPath>
    <clipPath id="hoodieClip">
      <path d="M56,0 Q95,10 114,42 L126,66 L155,84 L178,124 L158,150 L136,136 L136,260 L54,260 L54,136 L32,150 L12,124 L35,84 L64,66 L76,42 Q92,10 132,0 Q110,24 95,24 Q79,24 56,0 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <g opacity=".18">
    <circle cx="180" cy="160" r="180" fill="#54d7ff"/>
    <circle cx="1020" cy="110" r="170" fill="#8d6bff"/>
    <circle cx="870" cy="650" r="180" fill="#ff67c8"/>
  </g>
  <g opacity=".12">
    <path d="M0 560 L640 80 L730 80 L80 760 L0 760 Z" fill="#54d7ff"/>
    <path d="M180 760 L890 120 L965 120 L320 760 Z" fill="#ffffff"/>
  </g>

  <g transform="translate(82 96)">
    <!-- Tshirt -->
    <g transform="translate(0 40)">
      <rect x="-18" y="-18" width="206" height="300" rx="26" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
      <g clip-path="url(#tshirtClip)" transform="translate(14 16)">
        <rect x="0" y="0" width="160" height="250" fill="url(#cyanBlue)"/>
        <rect x="-10" y="38" width="190" height="28" fill="#f2fbff" opacity=".95"/>
        <path d="M-10 125 L170 55" stroke="#ffffff" stroke-width="14" opacity=".72"/>
        <path d="M5 258 L165 122" stroke="#0d2242" stroke-width="16" opacity=".28"/>
        <circle cx="118" cy="180" r="42" fill="#ffffff" opacity=".15"/>
      </g>
      <text x="84" y="304" fill="#d7e2f1" font-size="22" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2">TSHIRT</text>
    </g>

    <!-- Jersey -->
    <g transform="translate(248 0)">
      <rect x="-18" y="-18" width="214" height="320" rx="26" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
      <g clip-path="url(#jerseyClip)" transform="translate(14 18)">
        <rect x="0" y="0" width="168" height="252" fill="url(#violetPink)"/>
        <path d="M12 18 H156 V58 H12 Z" fill="#ffffff" opacity=".90"/>
        <path d="M84 0 V252" stroke="#fff" stroke-width="8" opacity=".52"/>
        <path d="M0 96 H168" stroke="#fff" stroke-width="14" opacity=".18"/>
        <text x="84" y="168" fill="#ffffff" font-size="74" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle" opacity=".92">23</text>
      </g>
      <text x="89" y="324" fill="#d7e2f1" font-size="22" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2">JERSEY</text>
    </g>

    <!-- Polo shirt -->
    <g transform="translate(522 26)">
      <rect x="-18" y="-18" width="228" height="324" rx="26" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
      <g clip-path="url(#poloClip)" transform="translate(16 16)">
        <rect x="0" y="0" width="190" height="255" fill="url(#mint)"/>
        <path d="M72 0 L94 24 L118 0 L132 20 L110 46 L95 34 L80 46 L58 20 Z" fill="#0b1a31"/>
        <path d="M80 46 H110 V92 H80 Z" fill="#ffffff" opacity=".88"/>
        <path d="M0 126 L192 70" stroke="#ffffff" stroke-width="14" opacity=".32"/>
        <path d="M12 210 H180" stroke="#0d284f" stroke-width="18" opacity=".24"/>
      </g>
      <text x="95" y="326" fill="#d7e2f1" font-size="22" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2">POLOSHIRT</text>
    </g>

    <!-- Hoodie -->
    <g transform="translate(812 18)">
      <rect x="-18" y="-18" width="232" height="330" rx="26" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
      <g clip-path="url(#hoodieClip)" transform="translate(12 12)">
        <rect x="0" y="0" width="190" height="262" fill="url(#gold)"/>
        <path d="M64 0 Q96 18 126 0 Q116 26 96 26 Q76 26 64 0 Z" fill="#ffffff" opacity=".88"/>
        <path d="M34 106 L156 66" stroke="#ffffff" stroke-width="14" opacity=".46"/>
        <path d="M44 188 H148" stroke="#aa5a12" stroke-width="18" opacity=".22"/>
        <rect x="72" y="156" width="48" height="38" rx="8" fill="#ffffff" opacity=".16"/>
      </g>
      <text x="96" y="332" fill="#d7e2f1" font-size="22" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2">HOODIE</text>
    </g>
  </g>

  <g transform="translate(78 650)">
    <text x="0" y="0" fill="#ffffff" font-size="24" font-family="Arial, sans-serif" opacity=".78" letter-spacing="4">SUBLIMATION DESIGN COLLECTION</text>
  </g>

  <g filter="url(#glow)">
    <circle cx="1060" cy="188" r="8" fill="#ffffff" opacity=".78"/>
    <circle cx="988" cy="246" r="6" fill="#54d7ff" opacity=".7"/>
    <circle cx="918" cy="126" r="7" fill="#8d6bff" opacity=".75"/>
  </g>
</svg>
